/* Layout: one-screen app — names, feeling bubble + stitched friend on a mood mat, tabbed tray below. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1b26;--surface:#2a2735;--line:#3b3748;--fg:#efeaf6;--muted:#a59fb4;--accent:#b8a3dc;color-scheme:dark}}

  .chips{gap:8px;flex-wrap:wrap;overflow:visible}
  .chip{font-size:17px;padding:10px 18px}
  .trayhint{font-size:16px}
  .tray{grid-template-columns:repeat(7,1fr);gap:10px;height:230px}
  .tray .part{height:86px;border-radius:20px;padding:10px}
  .tray .opt{height:90px;font-size:13px}
  .opt .ic{width:42px;height:42px}
  .part em{font-size:12px;bottom:5px}
  .more{font-size:15px;padding:7px 14px 7px 16px}
  .card{max-width:480px;padding:30px 28px;border-radius:32px;gap:16px}
  .card h2{font-size:32px}
  .card label{font-size:16px}
  .card input{font-size:20px;padding:14px 16px}
  .card p{font-size:16px}
  .go{font-size:19px;padding:16px}
  .sheet.bottom{align-items:center}
}
/* landscape iPad: big friend on the left, everything you pick on the right */
@media (min-width:1000px) and (min-height:600px) and (orientation:landscape){
  .app{max-width:1320px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(400px,1fr);grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"h h" "s c" "s t" "s w";column-gap:24px;row-gap:14px}
  .app>header{grid-area:h}
  .stage{grid-area:s;min-height:0}
  .chips{grid-area:c;align-self:start}
  .trayhint{grid-area:t}
  .traywrap{grid-area:w;min-height:0;display:flex;flex-direction:column}
  .tray{height:auto;flex:1;min-height:0;grid-template-columns:repeat(4,1fr)}
  .moWrap{width:calc(100% - 120px)}

/* body map */
function region(x,y){
  if(x<64||x>236)return "hands";

}
const REG={head:"head",face:"face",chest:"chest",tummy:"tummy",hands:"flippers",tail:"tail"};

}
function bodyWords(){
  const r=[...new Set(state.body.map(p=>REG[region(p.x,p.y)]))];
  return r.length?r.length>1?r.slice(0,-1).join(", ")+" and "+r[r.length-1]:r[0]:"";
}
$("mo").addEventListener("pointerdown",e=>{
  if(cat!=="body")return;
  const ch=$("char"),pt=$("mo").createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const p=pt.matrixTransform(ch.getScreenCTM().inverse());
  const hit=state.body.findIndex(b=>Math.hypot(b.x-p.x,b.y-p.y)<20);
  if(hit>=0)state.body.splice(hit,1);
  else{if(state.body.length>=5)state.body.shift();state.body.push({x:Math.round(p.x),y:Math.round(p.y)})}
  save();drawBody();update();if(cat==="body")renderTray();
});

/* feeling logic */
function feeling(){
  if(!state.mouth&&!state.eyes&&!state.brows)return null;
  const s={};
  ["eyes","brows","mouth"].forEach(k=>{const p=state[k]&&find(k,state[k]);if(p)for(const f in p.v)s[f]=(s[f]||0)+p.v[f]*(k==="mouth"?1.3:1)});
  let best=null;ORDER.forEach(f=>{if(s[f]&&(!best||s[f]>s[best]))best=f});return best;
}
function phrase(f){return FEEL[f][0]}
function sentence(){
  const f=feeling(),n=state.kid.trim(),name=n||"Your friend",ch=state.child.trim();
  if(!f){const t=n?`Give ${n} a face`:"Give your friend a face";return {html:esc(t),text:t,f}}
  const also=null;
  const main=`${name} feels ${phrase(f)}${also?` and a bit ${FEEL[also][0]}`:""}`;
  const where=bodyWords();
  const q=where?`${name} feels it in their ${where}.`:`Do you feel ${FEEL[f][0]} too${ch?", "+ch:""}?`;
  return {f,also,where,html:`${esc(name)} feels <b style="--feelc:${FEEL[f][1]}">${esc(phrase(f))}</b>${also?` and a bit <b style="--feelc:${FEEL[also][1]}">${FEEL[also][0]}</b>`:""}<small>${esc(q)}</small>`,text:`${main}. ${q}`};
}

}

/* auto-fit so hats etc. are never cut off */
let vb=[0,30,300,360],raf=0;
function fit(){
  const b=$("char").getBBox(),pad=20;
  const x0=Math.min(0,b.x-pad),y0=Math.min(30,b.y-pad),x1=Math.max(300,b.x+b.width+pad),y1=Math.max(390,b.y+b.height+pad);
  const to=[x0,y0,x1-x0,y1-y0],from=vb.slice(),t0=performance.now();
  cancelAnimationFrame(raf);
  const step=t=>{const k=Math.min(1,(t-t0)/350),e=1-Math.pow(1-k,3);vb=from.map((v,i)=>v+(to[i]-v)*e);$("mo").setAttribute("viewBox",vb.join(" "));if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}

/* save card */
function charSVG(){
  const c=$("mo").cloneNode(true),cs=getComputedStyle($("mo"));
  c.querySelectorAll(".guide").forEach(e=>e.remove());
  c.querySelectorAll(".breathe,.wave,.pop,.spot").forEach(e=>e.removeAttribute("class"));
  c.removeAttribute("class");c.removeAttribute("style");
  c.setAttribute("width","900");c.setAttribute("height",Math.round(900*vb[3]/vb[2]));
  let s=new XMLSerializer().serializeToString(c);
  const defs=new XMLSerializer().serializeToString($("defs"));
  s=s.replace(/(<svg[^>]*>)/,`$1${defs}<style>.seam{fill:none;stroke-dasharray:6 6;stroke-width:2.2;opacity:.7}</style>`);
  return s.replace(/var\(--([a-z]+)\)/g,(_,n)=>cs.getPropertyValue("--"+n).trim()||"#3a3550");
}
function wrap(ctx,text,x,y,max,lh){
  const words=text.split(" ");let line="";
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){ctx.fillText(line,x,y);y+=lh;line=w}else line=t}
  if(line)ctx.fillText(line,x,y);return y+lh;
}

  const set=()=>{b.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M7 3h10v4H7z"/><path d="M7 12h6M7 15h4"/></svg>';const ch=state.child.trim(),n=state.kid.trim();b.setAttribute("aria-label","Names"+(n?`: ${ch?ch+" and ":""}${n}`:""))};
  nameBtn=function(){set()};set();})();
/* ---------- v3 stage 8: close pop-ups by tapping outside, the ×, or Escape ---------- */
(function(){
  const X='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const closable={diary:"diarybody",grown:"grownbody",cardsheet:null,ns:null,sheet:null};
  const canClose=id=>id!=="sheet"||!!(state.child.trim()||state.kid.trim());
  const close=id=>{if(canClose(id))$(id).hidden=true};
  Object.keys(closable).forEach(id=>{
    const sh=$(id);if(!sh)return;
    sh.addEventListener("click",e=>{if(e.target===sh)close(id)});
  });
  // a × at the top of the diary and grown-ups, added each time they're drawn
  const addX=(body,id)=>{const b=$(body);if(b.querySelector(".xbtn"))return;const x=document.createElement("button");x.type="button";x.className="xbtn";x.setAttribute("aria-label","Close");x.innerHTML=X;x.addEventListener("click",()=>close(id));b.prepend(x)};
  const _rd8=renderDiary;renderDiary=function(){_rd8();addX("diarybody","diary")};
  const _rg8=renderGrown;renderGrown=function(){_rg8();addX("grownbody","grown")};
  document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;["cardsheet","diary","grown","ns","sheet"].forEach(id=>{if($(id)&&!$(id).hidden)close(id)})});
})();

</script>
</body>
